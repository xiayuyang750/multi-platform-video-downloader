org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机走代理时 HTTPS 会间歇性卡住（表现为 maven.aliyun.com 被解析到
# Clash 的 fake-ip 段 198.18.0.0/15 后连接超时）。默认超时太短，一抖动
# 整个依赖解析就失败；放宽到 2 分钟，偶尔的卡顿就扛过去了。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# JVM（Gradle）不读系统代理设置，而本机 Clash 是 TUN 模式：PowerShell
# 走系统代理一切正常，Gradle 直连时并发请求一多就连接超时。
# 这里显式让它走 Clash 的本地 HTTP 端口，路径与 PowerShell 一致。
# 注意：这几行是本机网络环境相关，换机器（或没开 Clash）时要改或删。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7892
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7892
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
